name: Publish validated TensorRT images

on:
  workflow_dispatch:
    inputs:
      dutch_candidate_run_id:
        description: Successful Ampere-plus Dutch candidate run
        required: true
      english_candidate_run_id:
        description: Successful Ampere-plus English candidate run whose local images are promoted
        required: true
      release_tag:
        description: Signed release tag to recover when the workflow is dispatched from the default branch
        required: false

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, nvidia, ampere-plus]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Require successful exact-commit candidate runs
        env:
          GH_TOKEN: ${{ github.token }}
          DUTCH_RUN: ${{ inputs.dutch_candidate_run_id }}
          ENGLISH_RUN: ${{ inputs.english_candidate_run_id }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" = tag ]]; then
            release_tag="${GITHUB_REF_NAME}"
            source_commit="${GITHUB_SHA}"
          else
            release_tag="${REQUESTED_RELEASE_TAG}"
            if [[ -z "${release_tag}" ]]; then
              printf 'A signed release tag is required for default-branch recovery.\n' >&2
              exit 1
            fi
            git fetch --force origin \
              "refs/tags/${release_tag}:refs/tags/${release_tag}"
            tag_object=$(git cat-file -p "${release_tag}")
            if [[ "${tag_object}" != *"-----BEGIN SSH SIGNATURE-----"* ]]; then
              printf 'Recovery tag %s is not an SSH-signed annotated tag.\n' \
                "${release_tag}" >&2
              exit 1
            fi
            source_commit=$(git rev-list -n 1 "${release_tag}")
          fi
          package_version="${release_tag#v}"
          tagged_version=$(git show "${release_tag}:pyproject.toml" \
            | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')
          if [[ "${release_tag}" != "v${tagged_version}" ]] \
            || [[ "${package_version}" != "${tagged_version}" ]]; then
            printf 'Tag %s does not match package version %s.\n' \
              "${release_tag}" "${tagged_version}" >&2
            exit 1
          fi
          for run_id in "${DUTCH_RUN}" "${ENGLISH_RUN}"; do
            conclusion=$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" \
              --json conclusion --jq .conclusion)
            run_source_commit=$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" \
              --json headSha --jq .headSha)
            test "${conclusion}" = success
            test "${run_source_commit}" = "${source_commit}"
          done
          {
            echo "RELEASE_TAG=${release_tag}"
            echo "SOURCE_COMMIT=${source_commit}"
          } >>"${GITHUB_ENV}"
      - name: Verify the exact locally validated image identities
        env:
          ENGLISH_RUN: ${{ inputs.english_candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source deploy/triton/versions.env
          package_version=$(python deploy/read_project_version.py)
          runtime="meddeid-triton-runtime:${package_version}-trt${MEDDEID_TRITON_STACK}-ci"
          gateway="meddeid-triton-gateway:${package_version}-ci"
          gh run download "${ENGLISH_RUN}" --repo "${GITHUB_REPOSITORY}" \
            --name "triton-ampere-plus-english_synthetic-evidence-${ENGLISH_RUN}" \
            --dir _release/image-evidence
          runtime_id=$(docker image inspect "${runtime}" --format '{{.Id}}')
          gateway_id=$(docker image inspect "${gateway}" --format '{{.Id}}')
          test "${runtime_id}" = "$(jq -r '.[0].Id' _release/image-evidence/candidate-image-inspect.json)"
          test "${gateway_id}" = "$(jq -r '.[0].Id' _release/image-evidence/gateway-image-inspect.json)"
          runtime_revision=$(docker image inspect "${runtime}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          evidence_runtime_revision=$(jq -r \
            '.[0].Config.Labels["org.opencontainers.image.revision"] // ""' \
            _release/image-evidence/candidate-image-inspect.json)
          test "${runtime_revision}" = "${evidence_runtime_revision}"
          if [[ -n "${runtime_revision}" ]]; then
            test "${runtime_revision}" = "${SOURCE_COMMIT}"
          fi
          gateway_revision=$(docker image inspect "${gateway}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          evidence_source_commit=$(jq -r '.source_commit' \
            _release/image-evidence/fixture-contract-preflight.json)
          test "${gateway_revision}" = "${SOURCE_COMMIT}"
          test "${evidence_source_commit}" = "${SOURCE_COMMIT}"
          {
            echo "PACKAGE_VERSION=${package_version}"
            echo "TRITON_STACK=${MEDDEID_TRITON_STACK}"
            echo "CANDIDATE_RUNTIME=${runtime}"
            echo "CANDIDATE_GATEWAY=${gateway}"
          } >>"${GITHUB_ENV}"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated runtime and gateway images
        id: push
        run: |
          runtime_name="ghcr.io/${GITHUB_REPOSITORY_OWNER}/meddeid-triton-runtime"
          runtime_tag="${runtime_name}:${PACKAGE_VERSION}-trt${TRITON_STACK}"
          gateway_name="ghcr.io/${GITHUB_REPOSITORY_OWNER}/meddeid-triton-gateway"
          gateway_tag="${gateway_name}:${PACKAGE_VERSION}"
          if docker buildx imagetools inspect "${runtime_tag}" >/dev/null 2>&1; then
            printf 'Refusing to overwrite %s.\n' "${runtime_tag}" >&2
            exit 1
          fi
          if docker buildx imagetools inspect "${gateway_tag}" >/dev/null 2>&1; then
            printf 'Refusing to overwrite %s.\n' "${gateway_tag}" >&2
            exit 1
          fi
          docker tag "${CANDIDATE_RUNTIME}" "${runtime_tag}"
          docker tag "${CANDIDATE_GATEWAY}" "${gateway_tag}"
          docker push "${runtime_tag}"
          docker push "${gateway_tag}"
          runtime_digest=$(docker image inspect "${runtime_tag}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -F@ -v name="${runtime_name}" '$1 == name {print $2; exit}')
          gateway_digest=$(docker image inspect "${gateway_tag}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -F@ -v name="${gateway_name}" '$1 == name {print $2; exit}')
          test -n "${runtime_digest}"
          test -n "${gateway_digest}"
          {
            echo "runtime-name=${runtime_name}"
            echo "runtime-digest=${runtime_digest}"
            echo "gateway-name=${gateway_name}"
            echo "gateway-digest=${gateway_digest}"
          } >>"${GITHUB_OUTPUT}"
      - name: Attest TensorRT runtime provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.runtime-name }}
          subject-digest: ${{ steps.push.outputs.runtime-digest }}
          push-to-registry: true
      - name: Attest gateway provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.gateway-name }}
          subject-digest: ${{ steps.push.outputs.gateway-digest }}
          push-to-registry: true
      - name: Generate TensorRT runtime SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.push.outputs.runtime-name }}@${{ steps.push.outputs.runtime-digest }}
          format: spdx-json
          output-file: deploy/triton/triton-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate gateway SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.push.outputs.gateway-name }}@${{ steps.push.outputs.gateway-digest }}
          format: spdx-json
          output-file: deploy/triton/gateway-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest TensorRT runtime SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.runtime-name }}
          subject-digest: ${{ steps.push.outputs.runtime-digest }}
          sbom-path: deploy/triton/triton-sbom.spdx.json
          push-to-registry: true
      - name: Attest gateway SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.gateway-name }}
          subject-digest: ${{ steps.push.outputs.gateway-digest }}
          sbom-path: deploy/triton/gateway-sbom.spdx.json
          push-to-registry: true
