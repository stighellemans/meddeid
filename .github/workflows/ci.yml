name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies and test requirements
        run: |
          python -m pip install \
            'meddeid-core @ git+https://github.com/stighellemans/meddeid-core.git@a2f95a4a22c3851fea119296ccd4037b9ee0913e' \
            'meddeid-language-en @ git+https://github.com/stighellemans/meddeid-language-en.git@7482c1693d9788bf3699d762203adebf66f7d765' \
            'meddeid-language-nl @ git+https://github.com/stighellemans/meddeid-language-nl.git@c436dae1ea7e383a1e742304271e14c793fc4caf'
          python -m pip install '.[dev]' build twine
          python -m pip check
      - run: pytest -q
      - name: Build and inspect distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m twine check dist/*

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: MEDDEID_MODEL=test/model docker compose config --quiet
      - run: MEDDEID_MODEL=test/model MEDDEID_MODEL_DIR=/tmp docker compose -f compose.yaml -f compose.offline.yaml config --quiet
      - run: MEDDEID_MODEL=test/model MEDDEID_PYTORCH_CUDA_IMAGE=meddeid-api:cuda-test MEDDEID_API_KEY=test-only docker compose -f compose.yaml -f compose.cuda.yaml config --quiet
      - run: MEDDEID_MODEL=test/model MEDDEID_LANGUAGE_PROFILE=nl-BE MEDDEID_TRITON_RUNTIME_IMAGE=meddeid-triton-runtime:test MEDDEID_TRITON_MODEL_REPOSITORY=/tmp MEDDEID_API_KEY=test-only docker compose -f compose.triton.yaml config --quiet
      - run: MEDDEID_MODEL=test/model MEDDEID_LANGUAGE_PROFILE=nl-BE MEDDEID_TRITON_RUNTIME_IMAGE=meddeid-triton-runtime:test MEDDEID_TRITON_MODEL_REPOSITORY=/tmp MEDDEID_API_KEY=test-only docker compose -f compose.triton.yaml -f compose.triton.validation.yaml config --quiet
