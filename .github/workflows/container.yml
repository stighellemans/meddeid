name: Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - compose*.yaml
      - constraints/**
      - deploy/**
      - pyproject.toml
      - src/**
      - scripts/**
      - .github/workflows/container.yml

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/meddeid-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Resolve and verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_REF_TYPE"] == "tag":
              tag = os.environ["RELEASE_TAG"].removeprefix("v")
              if tag != version:
                  raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PACKAGE_VERSION={version}\n")
          PY
      - name: Build local smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: meddeid-api:ci
          build-args: |
            MEDDEID_VERSION=${{ env.PACKAGE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Enforce CPU image-size budget
        run: |
          python deploy/measure_container_image.py meddeid-api:ci \
            --budget-file deploy/image-size-budgets.json \
            --budget-key cpu \
            --output cpu-image-size.json
      - name: Run hardened offline smoke test
        run: |
          docker run --rm --entrypoint python meddeid-api:ci -c \
            "import importlib.util, torch; assert torch.version.cuda is None; assert all(importlib.util.find_spec(name) is None for name in ('tensorrt', 'tritonclient', 'onnxruntime', 'triton'))"
          docker network create --internal meddeid-smoke
          docker run --detach --name meddeid-smoke \
            --network meddeid-smoke \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --env MEDDEID_API_KEY=ci-smoke-secret \
            --env MEDDEID_REQUIRE_API_KEY=true \
            meddeid-api:ci
          docker run --rm \
            --network meddeid-smoke \
            --volume "$PWD/scripts/container_smoke.py:/smoke.py:ro" \
            --entrypoint python \
            meddeid-api:ci \
            /smoke.py \
            --base-url http://meddeid-smoke:8000 \
            --api-key ci-smoke-secret
          test "$(docker inspect --format '{{.Config.User}}' meddeid-smoke)" = "10001:10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' meddeid-smoke)" = "true"
      - name: Collect CPU image-size evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-image-size-${{ github.run_id }}
          path: cpu-image-size.json
          if-no-files-found: warn
      - name: Reject fixable high or critical vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 10m \
            meddeid-api:ci
      - name: Show container logs on failure
        if: failure()
        run: docker logs meddeid-smoke || true
      - name: Clean up smoke resources
        if: always()
        run: |
          docker rm --force meddeid-smoke 2>/dev/null || true
          docker network rm meddeid-smoke 2>/dev/null || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve package version
        run: echo "PACKAGE_VERSION=$(python deploy/read_project_version.py)" >>"${GITHUB_ENV}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish multi-architecture image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MEDDEID_VERSION=${{ env.PACKAGE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
