name: Build CUDA validation candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Signed release tag to build
        required: true
        default: v0.4.2
      candidate_tag:
        description: Explicit unvalidated GHCR tag
        required: true
        default: 0.4.2-cuda12.9-validation

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/meddeid-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Verify explicit candidate identity
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          package_version=$(python deploy/read_project_version.py)
          source_version="${SOURCE_REF#v}"
          source deploy/pytorch-cuda/versions.env
          expected_tag="${package_version}-cuda${MEDDEID_PYTORCH_CUDA_VERSION}-validation"
          if [[ "${SOURCE_REF}" != v* || "${source_version}" != "${package_version}" ]]; then
            printf 'source ref %s does not match package version %s\n' "${SOURCE_REF}" "${package_version}" >&2
            exit 1
          fi
          if [[ "${CANDIDATE_TAG}" != "${expected_tag}" ]]; then
            printf 'candidate tag %s does not match expected %s\n' "${CANDIDATE_TAG}" "${expected_tag}" >&2
            exit 1
          fi
          {
            echo "PACKAGE_VERSION=${package_version}"
            echo "PYTORCH_VERSION=${MEDDEID_PYTORCH_VERSION}"
            echo "PYTORCH_INDEX_URL=${MEDDEID_PYTORCH_INDEX_URL}"
            echo "PYTORCH_CUDA_VERSION=${MEDDEID_PYTORCH_CUDA_VERSION}"
            echo "VCS_REF=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(git show -s --format=%cI HEAD)"
          } >>"${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish unvalidated CUDA candidate
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.candidate_tag }}
          build-args: |
            TORCH_VERSION=${{ env.PYTORCH_VERSION }}
            TORCH_INDEX_URL=${{ env.PYTORCH_INDEX_URL }}
            MEDDEID_ACCELERATOR=cuda
            MEDDEID_CUDA_VERSION=${{ env.PYTORCH_CUDA_VERSION }}
            MEDDEID_DEVICE=cuda
            MEDDEID_TORCH_PRECISION=fp16
            MEDDEID_TORCH_COMPILE_MODE=off
            MEDDEID_VERSION=${{ env.PACKAGE_VERSION }}
            VCS_REF=${{ env.VCS_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=pytorch-cuda
          cache-to: type=gha,mode=max,scope=pytorch-cuda
          provenance: mode=max
          sbom: true
      - name: Attest candidate image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record candidate receipt
        run: |
          printf '%s@%s\n' \
            "${IMAGE_NAME}:${{ inputs.candidate_tag }}" \
            "${{ steps.push.outputs.digest }}" | tee cuda-candidate-receipt.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cuda-candidate-receipt-${{ github.run_id }}
          path: cuda-candidate-receipt.txt
