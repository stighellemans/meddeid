name: meddeid

services:
  meddeid:
    image: ${MEDDEID_API_IMAGE:-ghcr.io/stighellemans/meddeid-api:0.2.0}
    build:
      context: .
      args:
        MEDDEID_CORE_COMMIT: ${MEDDEID_CORE_COMMIT:-13cd703eba34d92b128f54813741ac956258c213}
        MEDDEID_LANGUAGE_EN_COMMIT: ${MEDDEID_LANGUAGE_EN_COMMIT:-cf624a922c83bcd0a53bc7ca284d191ded226282}
        MEDDEID_LANGUAGE_NL_COMMIT: ${MEDDEID_LANGUAGE_NL_COMMIT:-7fad096fd40c138036db0835d4de4ffd5513ae1a}
        MEDDEID_MODEL_REVISION: ${MEDDEID_MODEL_REVISION:-c5706e009c7f45988328219d0fb1b68875a99519}
    pull_policy: missing
    ports:
      - "${MEDDEID_BIND_ADDRESS:-127.0.0.1}:${MEDDEID_PORT:-8000}:8000"
    environment:
      MEDDEID_API_KEY: ${MEDDEID_API_KEY:-}
      MEDDEID_REQUIRE_API_KEY: ${MEDDEID_REQUIRE_API_KEY:-false}
      MEDDEID_DOCS_ENABLED: ${MEDDEID_DOCS_ENABLED:-false}
      MEDDEID_UI_ENABLED: ${MEDDEID_UI_ENABLED:-false}
      MEDDEID_MAX_INPUT_CHARS: ${MEDDEID_MAX_INPUT_CHARS:-20000}
      MEDDEID_MAX_BATCH_DOCUMENTS: ${MEDDEID_MAX_BATCH_DOCUMENTS:-32}
      MEDDEID_MAX_BATCH_CHARS: ${MEDDEID_MAX_BATCH_CHARS:-200000}
      MEDDEID_MAX_REQUEST_BYTES: ${MEDDEID_MAX_REQUEST_BYTES:-2000000}
      MEDDEID_MAX_CONCURRENT_REQUESTS: ${MEDDEID_MAX_CONCURRENT_REQUESTS:-1}
      MEDDEID_QUEUE_TIMEOUT_SECONDS: ${MEDDEID_QUEUE_TIMEOUT_SECONDS:-30}
      MEDDEID_WORKERS: ${MEDDEID_WORKERS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4))"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
