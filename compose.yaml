name: meddeid

services:
  meddeid:
    image: ${MEDDEID_API_IMAGE:-ghcr.io/stighellemans/meddeid-api:0.4.2}
    build:
      context: .
      args:
        MEDDEID_CORE_COMMIT: ${MEDDEID_CORE_COMMIT:-13a5b5d6049611e0c64e0d375d1cb5d99266bc15}
        MEDDEID_LANGUAGE_EN_COMMIT: ${MEDDEID_LANGUAGE_EN_COMMIT:-7958b77ee83295de7d809a8f52d6de2c2732c35e}
        MEDDEID_LANGUAGE_NL_COMMIT: ${MEDDEID_LANGUAGE_NL_COMMIT:-c316c06669789fd16b2405a1ca8076d878f3d730}
    pull_policy: missing
    ports:
      - "${MEDDEID_BIND_ADDRESS:-127.0.0.1}:${MEDDEID_PORT:-8000}:8000"
    environment:
      MEDDEID_MODEL: ${MEDDEID_MODEL:?set MEDDEID_MODEL to a Hugging Face model ID or mounted local bundle}
      MEDDEID_REVISION: ${MEDDEID_REVISION:-}
      MEDDEID_OFFLINE: ${MEDDEID_OFFLINE:-false}
      MEDDEID_API_KEY: ${MEDDEID_API_KEY:-}
      MEDDEID_REQUIRE_API_KEY: ${MEDDEID_REQUIRE_API_KEY:-false}
      MEDDEID_LANGUAGE_PROFILE: ${MEDDEID_LANGUAGE_PROFILE:-}
      MEDDEID_BACKEND: ${MEDDEID_BACKEND:-torch}
      MEDDEID_DEVICE: ${MEDDEID_DEVICE:-cpu}
      MEDDEID_TORCH_PRECISION: ${MEDDEID_TORCH_PRECISION:-fp32}
      MEDDEID_TORCH_COMPILE_MODE: ${MEDDEID_TORCH_COMPILE_MODE:-off}
      MEDDEID_TORCH_COMPILE_DYNAMIC: ${MEDDEID_TORCH_COMPILE_DYNAMIC:-true}
      MEDDEID_SERVING_PROFILE: ${MEDDEID_SERVING_PROFILE:-latency}
      MEDDEID_MICROBATCH_ENABLED: ${MEDDEID_MICROBATCH_ENABLED:-auto}
      MEDDEID_MICROBATCH_MAX_WINDOWS: ${MEDDEID_MICROBATCH_MAX_WINDOWS:-32}
      MEDDEID_MICROBATCH_MAX_TOKENS: ${MEDDEID_MICROBATCH_MAX_TOKENS:-16384}
      MEDDEID_MICROBATCH_MAX_WAIT_MS: ${MEDDEID_MICROBATCH_MAX_WAIT_MS:-1}
      MEDDEID_MICROBATCH_QUEUE_MAX_WINDOWS: ${MEDDEID_MICROBATCH_QUEUE_MAX_WINDOWS:-8192}
      MEDDEID_MICROBATCH_QUEUE_MAX_REQUESTS: ${MEDDEID_MICROBATCH_QUEUE_MAX_REQUESTS:-256}
      MEDDEID_SEQUENCE_LENGTH_BUCKETS: ${MEDDEID_SEQUENCE_LENGTH_BUCKETS:-auto}
      MEDDEID_TRITON_URL: ${MEDDEID_TRITON_URL:-}
      MEDDEID_TRITON_TIMEOUT: ${MEDDEID_TRITON_TIMEOUT:-30}
      MEDDEID_TRITON_TRANSPORT: ${MEDDEID_TRITON_TRANSPORT:-json}
      MEDDEID_WINDOW_BATCH_SIZE: ${MEDDEID_WINDOW_BATCH_SIZE:-32}
      MEDDEID_DOCS_ENABLED: ${MEDDEID_DOCS_ENABLED:-false}
      MEDDEID_UI_ENABLED: ${MEDDEID_UI_ENABLED:-false}
      MEDDEID_ACCESS_LOG: ${MEDDEID_ACCESS_LOG:-true}
      MEDDEID_PROXY_HEADERS: ${MEDDEID_PROXY_HEADERS:-false}
      MEDDEID_FORWARDED_ALLOW_IPS: ${MEDDEID_FORWARDED_ALLOW_IPS:-127.0.0.1}
      MEDDEID_MAX_INPUT_CHARS: ${MEDDEID_MAX_INPUT_CHARS:-20000}
      MEDDEID_MAX_BATCH_DOCUMENTS: ${MEDDEID_MAX_BATCH_DOCUMENTS:-32}
      MEDDEID_MAX_BATCH_CHARS: ${MEDDEID_MAX_BATCH_CHARS:-200000}
      MEDDEID_MAX_REQUEST_BYTES: ${MEDDEID_MAX_REQUEST_BYTES:-2000000}
      MEDDEID_MAX_CONCURRENT_REQUESTS: ${MEDDEID_MAX_CONCURRENT_REQUESTS:-auto}
      MEDDEID_QUEUE_TIMEOUT_SECONDS: ${MEDDEID_QUEUE_TIMEOUT_SECONDS:-30}
      MEDDEID_AGE_GRANULARITY_CONFIG: ${MEDDEID_AGE_GRANULARITY_CONFIG:-}
      MEDDEID_MIN_RECOMMENDED_DATE_SHIFT_DAYS: ${MEDDEID_MIN_RECOMMENDED_DATE_SHIFT_DAYS:-366}
      MEDDEID_WORKERS: ${MEDDEID_WORKERS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
    volumes:
      - meddeid-model-cache:/var/cache/meddeid/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4))"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  meddeid-model-cache:
