[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meddeid"
version = "0.3.0"
description = "Local-first multilingual clinical text de-identification framework with Python, CLI, batch, and HTTP interfaces"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "Stig Hellemans"}]
keywords = [
    "de-identification",
    "clinical-nlp",
    "medical-nlp",
    "pii-detection",
    "pii-redaction",
    "privacy",
    "healthcare",
    "multilingual",
    "offline",
    "transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Natural Language :: Dutch",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "meddeid-core>=0.2,<0.3",
    "meddeid-language-en>=0.2,<0.3",
    "meddeid-language-nl>=0.2,<0.3",
    "torch>=2.2",
    "transformers>=5.5,<6",
    "huggingface-hub>=0.25",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://stighellemans.github.io/meddeid/"
Documentation = "https://stighellemans.github.io/meddeid/workflows/inference/"
Source = "https://github.com/stighellemans/meddeid"
Issues = "https://github.com/stighellemans/meddeid/issues"
"Model and datasets" = "https://huggingface.co/collections/stighellemans/meddeid"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
triton = ["tritonclient[http]>=2.71,<2.72"]
research = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "meddeid-data[llm,parquet]>=0.3,<0.5",
    "meddeid-eval[plots]>=0.3,<0.5",
    "meddeid-training[plots]>=0.2,<0.3",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]
contributor = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "meddeid-data[llm,parquet]>=0.3,<0.5",
    "meddeid-eval[plots]>=0.3,<0.5",
    "meddeid-training[plots]>=0.2,<0.3",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "build>=1.2",
    "pytest>=8",
]
dev = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pytest>=8"]

[project.scripts]
meddeid = "meddeid.cli:main"
meddeid-server = "meddeid.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
